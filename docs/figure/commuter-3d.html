<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ParaPo commuter, 3D model</title>
<!--
  The walker's 3D model, drawn from docs/figure/commuter-reference.png, and
  the renderer that turns it into the app's sprites. Open it in a browser
  to see the sheet it makes; `node scripts/render-figure.mjs` writes the
  sheet and the flying frame into public/figure/.

  Units: about 1 tall, feet at y = 0, facing +z. A positive x-rotation
  swings a limb backwards. Everything is primitives, so there are no model
  files to keep in step.
-->
<style>
  body { margin: 0; padding: 24px 16px; font: 14px/1.5 system-ui, sans-serif; background: #f3f1ee; color: #1c1b1f; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .out { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .out canvas { background: repeating-conic-gradient(#e6e3df 0 25%, #fff 0 50%) 0 0 / 16px 16px; border: 1px solid #d8d4cf; }
</style>
</head>
<body>
<h1>The commuter, rendered as the app's sprites</h1>
<div class="out" id="out">Rendering…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- sizes the app expects (src/shared/index.css) ----------
  const CELL_W = 100, CELL_H = 130;   // one sheet cell at 2×
  const COLS = 5, ROWS = 4;           // standing + four steps; down, up, left, right
  const BASELINE = 8;                 // px from the cell's bottom to the soles; the CSS sits the cell 4 px (8 at 2×) under the anchor
  const FLY_W = 237, FLY_H = 130;     // the flying frame at 2×
  const SUPER = 4;                    // render this many times larger, then scale down

  // ---------- renderer & scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
  scene.add(camera);
  scene.add(new THREE.HemisphereLight(0xfff0e0, 0x3a3234, 0.95));
  // Lights ride with the camera, so every facing is lit the same way.
  const lightAt = (color, intensity, x, y, z) => {
    const l = new THREE.DirectionalLight(color, intensity);
    l.position.set(x, y, z);
    camera.add(l);
  };
  lightAt(0xfff4ea, 0.85, -2, 3, 0);     // key, upper left
  lightAt(0xfff6ee, 0.3, 2, 0.5, 0);     // fill, right
  lightAt(0xffa860, 0.6, -2, 1.5, -12);  // warm rims from behind
  lightAt(0xffb070, 0.35, 2.5, 1, -12);

  // ---------- materials ----------
  // A soft warm rim on every lit material, the glow the reference sheet has.
  function addRim(mat, strength) {
    mat.onBeforeCompile = (shader) => {
      shader.fragmentShader = shader.fragmentShader.replace('#include <dithering_fragment>',
        'float rimF = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 2.6);\n' +
        'gl_FragColor.rgb += vec3(1.0, 0.62, 0.32) * rimF * ' + strength.toFixed(2) + ';\n#include <dithering_fragment>');
    };
    return mat;
  }
  const M = (color, extra) => addRim(new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.78, metalness: 0 }, extra || {})), 0.2);
  const skin = M(0xf0b38c, { roughness: 0.7 });
  const tee = M(0xf3f1ec);
  const pants = M(0x25262d);
  const shoeMat = M(0xf5f5f2, { roughness: 0.6 });
  const soleMat = M(0xc9c7c3);
  const capMat = M(0x2c2f3a, { roughness: 0.85 });
  const hairMat = M(0x3a2921, { roughness: 0.9 });
  const packMat = M(0x2a2b31, { roughness: 0.8 });
  const eyeMat = M(0x17151a, { roughness: 0.3 });
  const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const phoneMat = M(0x1b1c21, { roughness: 0.4, metalness: 0.2 });
  const screenMat = new THREE.MeshBasicMaterial({ color: 0x7cc6ff });

  function mesh(geo, mat, parent, pos, scale, rot) {
    const m = new THREE.Mesh(geo, mat);
    if (pos) m.position.set(pos[0], pos[1], pos[2]);
    if (scale) m.scale.set(scale[0], scale[1], scale[2]);
    if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
    parent.add(m);
    return m;
  }
  const sphere = (r, w, h) => new THREE.SphereGeometry(r, w || 32, h || 20);
  const cyl = (rt, rb, h) => new THREE.CylinderGeometry(rt, rb, h, 24);

  // ---------- the commuter ----------
  const HIP_Y = 0.3;
  const figure = new THREE.Group();
  scene.add(figure);
  const root = new THREE.Group();
  root.position.y = HIP_Y;
  figure.add(root);

  // Torso: pants at the hips, a rounded white tee above.
  mesh(sphere(0.125), pants, root, [0, 0, 0], [1, 0.6, 0.9]);
  mesh(cyl(0.118, 0.13, 0.2), tee, root, [0, 0.11, 0], [1, 1, 0.88]);
  mesh(sphere(0.118), tee, root, [0, 0.21, 0], [1, 0.45, 0.88]);
  mesh(cyl(0.132, 0.132, 0.025), tee, root, [0, 0.02, 0], [1, 1, 0.9]);

  // Backpack, in its own group so it can swing, and its straps.
  const bagShape = new THREE.Shape();
  const bw = 0.2, bh = 0.22, br = 0.05;
  bagShape.moveTo(-bw / 2 + br, -bh / 2);
  bagShape.lineTo(bw / 2 - br, -bh / 2); bagShape.quadraticCurveTo(bw / 2, -bh / 2, bw / 2, -bh / 2 + br);
  bagShape.lineTo(bw / 2, bh / 2 - br); bagShape.quadraticCurveTo(bw / 2, bh / 2, bw / 2 - br, bh / 2);
  bagShape.lineTo(-bw / 2 + br, bh / 2); bagShape.quadraticCurveTo(-bw / 2, bh / 2, -bw / 2, bh / 2 - br);
  bagShape.lineTo(-bw / 2, -bh / 2 + br); bagShape.quadraticCurveTo(-bw / 2, -bh / 2, -bw / 2 + br, -bh / 2);
  const pack = new THREE.Group();
  pack.position.set(0, 0.22, -0.14);
  root.add(pack);
  mesh(new THREE.ExtrudeGeometry(bagShape, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.025, bevelSegments: 4, curveSegments: 8 }), packMat, pack, [0, -0.1, -0.06]);
  mesh(new THREE.ExtrudeGeometry(bagShape, { depth: 0.02, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 3, curveSegments: 6 }), packMat, pack, [0, -0.15, -0.105], [0.72, 0.4, 1]);
  mesh(cyl(0.004, 0.004, 0.13), soleMat, pack, [0, -0.11, -0.11], null, [0, 0, Math.PI / 2]);
  mesh(new THREE.TorusGeometry(0.022, 0.007, 8, 16, Math.PI), packMat, pack, [0, 0.03, -0.03]);
  for (const s of [-1, 1]) {
    mesh(new THREE.TorusGeometry(0.085, 0.011, 8, 20, Math.PI), packMat, root, [s * 0.075, 0.19, -0.03], null, [0, Math.PI / 2, 0]);
    mesh(new THREE.BoxGeometry(0.022, 0.12, 0.014), packMat, root, [s * 0.075, 0.13, 0.108], null, [-0.14, 0, 0]);
  }

  // Head
  const neck = new THREE.Group();
  neck.position.y = 0.24;
  root.add(neck);
  const headR = 0.23;
  const head = new THREE.Group();
  head.position.y = 0.22;
  neck.add(head);
  mesh(sphere(headR, 48, 32), skin, head, [0, 0, 0], [1.04, 0.96, 1]);
  for (const s of [-1, 1]) mesh(sphere(0.036), skin, head, [s * 0.226, -0.06, -0.015], [0.5, 1, 0.85]);

  // Hair: a shell over the back and sides, and teardrop locks.
  mesh(new THREE.SphereGeometry(headR + 0.012, 48, 28, Math.PI * 0.86, Math.PI * 1.28, 0, Math.PI * 0.64), hairMat, head, [0, 0.005, -0.004], [1.04, 0.97, 1.01]);
  const lockGeo = new THREE.LatheGeometry([[0, -1], [0.18, -0.88], [0.38, -0.62], [0.5, -0.32], [0.46, -0.1], [0.3, 0.02], [0, 0.06]]
    .map(([x, y]) => new THREE.Vector2(x, y)), 20);
  const lock = (pos, size, rot) => mesh(lockGeo, hairMat, head, pos, size, rot);
  for (const [x, len, tilt] of [[-0.16, 0.07, -0.5], [-0.08, 0.085, -0.2], [0.005, 0.09, 0.08], [0.09, 0.08, 0.3], [0.165, 0.068, 0.55]]) {
    const z = Math.sqrt(Math.max(0, headR * headR - x * x - 0.07 * 0.07)) - 0.015;
    lock([x, 0.062, z], [0.11, len, 0.055], [-0.45, 0, tilt]);
  }
  for (const s of [-1, 1]) {
    lock([s * 0.212, 0.07, 0.015], [0.075, 0.11, 0.055], [-0.05, 0, s * 0.18]);
    lock([s * 0.215, 0.06, -0.06], [0.09, 0.12, 0.07], [0.1, 0, s * 0.22]);
  }
  for (const [x, tilt] of [[-0.11, -0.3], [0, 0], [0.11, 0.3]]) lock([x, 0.0, -0.195], [0.14, 0.12, 0.07], [0.5, 0, tilt]);

  // Cap: crown, a curved brim, a button.
  const cap = new THREE.Group();
  cap.position.set(0, 0.078, -0.012);
  cap.rotation.x = -0.14;
  head.add(cap);
  mesh(new THREE.SphereGeometry(headR + 0.03, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.53), capMat, cap, [0, 0, 0], [1.05, 0.98, 1.04]);
  const brimShape = new THREE.Shape();
  brimShape.moveTo(-0.235, 0);
  brimShape.absellipse(0, 0, 0.235, 0.36, Math.PI, 0, true);
  brimShape.lineTo(-0.235, 0);
  const brimGeo = new THREE.ExtrudeGeometry(brimShape, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 2, curveSegments: 32 });
  brimGeo.rotateX(Math.PI / 2);
  const bp = brimGeo.attributes.position;
  for (let i = 0; i < bp.count; i++) bp.setY(i, bp.getY(i) - 1.6 * bp.getX(i) * bp.getX(i) * Math.min(1, bp.getZ(i) / 0.25 + 0.4));
  brimGeo.computeVertexNormals();
  const brim = new THREE.Group();
  brim.position.set(0, -0.018, 0);
  brim.rotation.x = 0.04;
  cap.add(brim);
  mesh(brimGeo, capMat, brim);
  mesh(sphere(0.022), capMat, cap, [0, headR + 0.02, 0], [1, 0.5, 1]);

  // Eyes with a highlight, and a little blush.
  for (const s of [-1, 1]) {
    const e = new THREE.Group();
    e.position.set(s * 0.098, -0.045, 0.188);
    e.rotation.y = s * 0.48;
    head.add(e);
    mesh(sphere(0.035), eyeMat, e, [0, 0, 0], [0.8, 1.3, 0.45]);
    mesh(sphere(0.011, 12, 8), whiteMat, e, [0.009, 0.019, 0.013]);
  }
  const blushMat = new THREE.MeshBasicMaterial({ color: 0xf08a7a, transparent: true, opacity: 0.35, depthWrite: false });
  for (const s of [-1, 1]) mesh(new THREE.CircleGeometry(0.028, 16), blushMat, head, [s * 0.13, -0.085, 0.178], [1, 0.6, 1], [0, s * 0.62, 0]);

  // Arms: short sleeve, forearm, round hand.
  function arm(side) {
    const shoulder = new THREE.Group();
    shoulder.position.set(side * 0.145, 0.2, 0);
    root.add(shoulder);
    mesh(sphere(0.052), tee, shoulder, [0, -0.01, 0]);
    mesh(cyl(0.05, 0.048, 0.075), tee, shoulder, [0, -0.045, 0]);
    mesh(cyl(0.036, 0.034, 0.05), skin, shoulder, [0, -0.095, 0]);
    const elbow = new THREE.Group();
    elbow.position.y = -0.115;
    shoulder.add(elbow);
    mesh(sphere(0.035), skin, elbow);
    mesh(cyl(0.034, 0.032, 0.07), skin, elbow, [0, -0.04, 0]);
    const hand = new THREE.Group();
    hand.position.y = -0.09;
    elbow.add(hand);
    mesh(sphere(0.043), skin, hand, [0, 0, 0], [0.9, 1, 0.85]);
    return { shoulder, elbow, hand };
  }
  const armL = arm(1), armR = arm(-1);

  // A phone in the right hand.
  const phone = new THREE.Group();
  phone.position.set(-0.01, -0.035, 0.03);
  armR.hand.add(phone);
  mesh(new THREE.BoxGeometry(0.052, 0.095, 0.012), phoneMat, phone);
  mesh(new THREE.PlaneGeometry(0.044, 0.085), screenMat, phone, [0, 0, 0.0065]);

  // Legs: pants, then white sneakers.
  function leg(side) {
    const hip = new THREE.Group();
    hip.position.set(side * 0.065, 0, 0);
    root.add(hip);
    mesh(cyl(0.06, 0.056, 0.14), pants, hip, [0, -0.065, 0]);
    const knee = new THREE.Group();
    knee.position.y = -0.13;
    hip.add(knee);
    mesh(sphere(0.056), pants, knee);
    mesh(cyl(0.056, 0.058, 0.1), pants, knee, [0, -0.055, 0]);
    const foot = new THREE.Group();
    foot.position.y = -0.12;
    knee.add(foot);
    mesh(sphere(0.06), shoeMat, foot, [0, 0, 0.03], [1.05, 0.72, 1.55]);
    mesh(cyl(0.062, 0.062, 0.018), soleMat, foot, [0, -0.037, 0.03], [1.02, 1, 1.52]);
    return { hip, knee, foot };
  }
  const legL = leg(1), legR = leg(-1);

  // Speed lines behind the feet, for the flying frame only.
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x3aa0ff });
  const speedLines = new THREE.Group();
  for (const [y, z, len] of [[0.47, -0.62, 0.3], [0.33, -0.72, 0.42], [0.19, -0.64, 0.28]]) {
    mesh(new THREE.CylinderGeometry(0.014, 0.014, len, 12), lineMat, speedLines, [0, y, z], null, [Math.PI / 2, 0, 0]);
  }
  figure.add(speedLines);

  // ---------- poses ----------
  const base = { y: HIP_Y, lean: 0, turn: 0, headX: 0, headY: 0, headZ: 0, hipL: 0, hipR: 0, kneeL: 0, kneeR: 0, footL: 0, footR: 0,
                 shL: 0.05, shR: 0.05, outL: 0.14, outR: 0.14, elL: -0.15, elR: -0.15, bag: -0.05 };
  const P = (o) => Object.assign({}, base, o);
  const POSES = {
    stand: () => P({}),
    walk: (t) => {
      const a = 0.54, s = Math.sin(t);
      return P({ y: HIP_Y - 0.004 + Math.abs(Math.cos(t)) * 0.018, lean: 0.05, turn: s * 0.08, headX: -0.03, headZ: -s * 0.03,
        hipL: -a * s, hipR: a * s,
        kneeL: Math.max(0, Math.sin(t - 1.2)) * 0.9 + 0.05, kneeR: Math.max(0, Math.sin(t + Math.PI - 1.2)) * 0.9 + 0.05,
        footL: -Math.max(0, -s) * 0.2, footR: -Math.max(0, s) * 0.2,
        shL: a * 1.1 * s, shR: -a * 1.1 * s, outL: 0.12, outR: 0.12, elL: -0.45, elR: -0.45,
        bag: -0.05 - Math.sin(t * 2 - 0.8) * 0.06 });
    },
    // Like a superhero: body level, one arm ahead, the other back, legs together.
    fly: () => P({ lean: 1.35, headX: -0.95, hipL: 0.1, hipR: -0.02, kneeL: 0.35, kneeR: 0.12, footL: 0.4, footR: 0.3,
      shL: -2.55, outL: 0.3, elL: -0.05, shR: 0.45, outR: 0.3, elR: -0.25, bag: 0.05 }),
  };

  const tmp = new THREE.Vector3();
  function pose(name, t) {
    const p = POSES[name](t || 0);
    root.position.y = p.y;
    root.rotation.set(p.lean, p.turn, 0);
    neck.rotation.set(p.headX, p.headY - p.turn * 0.6, p.headZ);
    legL.hip.rotation.x = p.hipL; legR.hip.rotation.x = p.hipR;
    legL.knee.rotation.x = p.kneeL; legR.knee.rotation.x = p.kneeR;
    legL.foot.rotation.x = p.footL - p.lean * 0.5; legR.foot.rotation.x = p.footR - p.lean * 0.5;
    armL.shoulder.rotation.set(p.shL, 0, p.outL); armR.shoulder.rotation.set(p.shR, 0, -p.outR);
    armL.elbow.rotation.x = p.elL; armR.elbow.rotation.x = p.elR;
    pack.rotation.x = p.bag;
    speedLines.visible = name === 'fly';
    // Stand the lowest sole on the ground; flying hangs where it is.
    figure.position.y = 0;
    figure.updateMatrixWorld(true);
    if (name !== 'fly') {
      const sole = (l) => { l.foot.getWorldPosition(tmp); return tmp.y - 0.045; };
      figure.position.y = -Math.min(sole(legL), sole(legR));
      figure.updateMatrixWorld(true);
    }
  }

  // ---------- camera & drawing ----------
  // Yaw puts the camera round the figure: 0 in front; the figure faces the
  // screen's left when the camera stands on its left (+x).
  const FACING_YAW = { down: 0, up: Math.PI, left: Math.PI / 2, right: -Math.PI / 2 };
  const PITCH = 0.12;
  function aim(yaw) {
    const d = 10;
    camera.position.set(d * Math.cos(PITCH) * Math.sin(yaw), d * Math.sin(PITCH), d * Math.cos(PITCH) * Math.cos(yaw));
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld(true);
  }
  // Render with the view's units spanning [x0, x1] × [y0, y1] into w × h pixels.
  function shoot(x0, x1, y0, y1, w, h) {
    Object.assign(camera, { left: x0, right: x1, bottom: y0, top: y1 });
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.render(scene, camera);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(renderer.domElement, 0, 0);
    return c;
  }
  // The drawn pixels' box, in view units, from a wide render.
  function measure() {
    const span = 2.4, px = 600;
    const c = shoot(-span / 2, span / 2, -span / 2, span / 2, px, px);
    const a = c.getContext('2d').getImageData(0, 0, px, px).data;
    let x0 = px, x1 = -1, y0 = px, y1 = -1;
    for (let y = 0; y < px; y++) for (let x = 0; x < px; x++) {
      if (a[(y * px + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    const u = span / px;
    return { left: -span / 2 + x0 * u, right: -span / 2 + (x1 + 1) * u, top: span / 2 - y0 * u, bottom: span / 2 - (y1 + 1) * u };
  }
  // Halve step by step: smoother than one big drawImage.
  function shrink(src, w, h) {
    let c = src;
    while (c.width / 2 >= w) {
      const n = document.createElement('canvas');
      n.width = c.width / 2; n.height = c.height / 2;
      const g = n.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(c, 0, 0, n.width, n.height);
      c = n;
    }
    if (c.width !== w) {
      const n = document.createElement('canvas');
      n.width = w; n.height = h;
      const g = n.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(c, 0, 0, w, h);
      c = n;
    }
    return c;
  }

  // Four steps a quarter-cycle apart, starting at the first full stride.
  const STEPS = [0, 1, 2, 3].map((k) => Math.PI / 2 + (k * Math.PI) / 2);
  const cells = [];
  for (const facing of ['down', 'up', 'left', 'right']) {
    cells.push({ facing, name: 'stand', t: 0 });
    for (const t of STEPS) cells.push({ facing, name: 'walk', t });
  }

  // One scale for every cell, so the figure never changes size between frames;
  // the soles sit BASELINE px up from each cell's bottom.
  function renderSheet(scale) {
    scale = scale || 1;
    let top = 0, half = 0;
    for (const c of cells) {
      pose(c.name, c.t); aim(FACING_YAW[c.facing]);
      const m = measure();
      top = Math.max(top, m.top);
      half = Math.max(half, -m.left, m.right);
    }
    const w = CELL_W * scale, h = CELL_H * scale, base = BASELINE * scale;
    const ppu = Math.min((h - base - 2 * scale) / top, (w / 2 - 2 * scale) / half);
    const sheet = document.createElement('canvas');
    sheet.width = w * COLS; sheet.height = h * ROWS;
    const g = sheet.getContext('2d');
    cells.forEach((c, i) => {
      pose(c.name, c.t); aim(FACING_YAW[c.facing]);
      const hw = w / 2 / ppu, y0 = -base / ppu;
      const big = shoot(-hw, hw, y0, y0 + h / ppu, w * SUPER, h * SUPER);
      g.drawImage(shrink(big, w, h), (i % COLS) * w, Math.floor(i / COLS) * h);
    });
    return sheet;
  }

  // The flying frame: side view facing right, fitted into its box.
  function renderFlying(scale) {
    scale = scale || 1;
    pose('fly'); aim(FACING_YAW.right);
    const m = measure();
    const w = FLY_W * scale, h = FLY_H * scale, pad = 3 * scale;
    const ppu = Math.min((w - 2 * pad) / (m.right - m.left), (h - 2 * pad) / (m.top - m.bottom));
    const cx = (m.left + m.right) / 2, cy = (m.top + m.bottom) / 2;
    const hw = w / 2 / ppu, hh = h / 2 / ppu;
    return shrink(shoot(cx - hw, cx + hw, cy - hh, cy + hh, w * SUPER, h * SUPER), w, h);
  }

  const rendered = { sheet: renderSheet(1), flying: renderFlying(1) };
  // RGBA pixels as base64, for scripts/render-figure.mjs.
  window.figurePixels = (name) => {
    const c = rendered[name];
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let bin = '';
    for (let i = 0; i < d.length; i += 0x8000) bin += String.fromCharCode.apply(null, d.subarray(i, i + 0x8000));
    return { width: c.width, height: c.height, rgba: btoa(bin) };
  };

  const out = document.getElementById('out');
  out.innerHTML = '';
  for (const c of [rendered.sheet, rendered.flying]) out.append(c);
  window.figureReady = true;
})();
</script>
</body>
</html>
