<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Para Po</title>
    <meta name="description" content="Jeepney routes in Metro Manila, drawn from the ground." />
    <!-- The brand maroon, measured from the logo; the manifest in vite.config.ts carries the same. Once the map is up, the map's own colour (statusBar.ts). -->
    <meta name="theme-color" content="#8a595a" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <!-- iOS installs by hand (Share → Add to Home Screen) and reads this, not the manifest's icons. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Opened from an iPhone's Home Screen, the map runs behind the status bar (statusBar.ts). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/commuter/main.tsx"></script>
  </body>
</html>
